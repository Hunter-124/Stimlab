name: CI

# Build + test the shipping presets, capture the documentation media with the in-app
# --shot path, and publish the release zip. Mirrors scripts/ci.ps1 (the local
# equivalent). No GPU/CUDA job - the runners have no NVIDIA GPU, so the AutoDock-GPU
# path is exercised locally only.

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cache vcpkg-built dependencies in the GitHub Actions cache (cold build ~minutes,
  # warm build seconds). Uses the runner's preinstalled vcpkg.
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build-test:
    name: build + ctest (windows)
    # GitHub-hosted, so this workflow runs for anyone who forks the repository
    # without a self-hosted runner having to exist. The job is runner-agnostic: it
    # pins its own vcpkg rather than relying on the image's, so pointing this line
    # at a private label is a one-line change if a faster machine is available.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake + Ninja
        uses: lukka/get-cmake@latest

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
        with:
          arch: x64

      - name: Verify clang-tidy
        shell: pwsh
        run: clang-tidy --version

      # x-gha binary cache needs these two tokens exported into the job env.

      - name: Enable vcpkg GitHub Actions binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # A self-hosted runner has no preinstalled vcpkg, so pin one explicitly. The
      # installed tree and the binary cache live on runner-local storage, outside the
      # workspace, so they survive the checkout clean between runs.
      - name: Check out pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 120deac3062162151622ca4860575a33844ba10b
          path: .vcpkg

      - name: Bootstrap vcpkg and point VCPKG_ROOT at it
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\.vcpkg" >> $env:GITHUB_ENV
          echo "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TOOL_CACHE\vcpkg-bincache" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TOOL_CACHE\vcpkg-bincache" | Out-Null

      - name: Assert vcpkg.json version matches project(BioCAD VERSION ...)
        shell: pwsh
        run: |
          $cmakeVer = & ./scripts/version.ps1
          $vcpkgVer = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).version
          Write-Host "CMakeLists.txt=$cmakeVer  vcpkg.json=$vcpkgVer"
          if ($cmakeVer -ne $vcpkgVer) {
            throw "version mismatch: CMakeLists.txt=$cmakeVer vcpkg.json=$vcpkgVer"
          }
          echo "BIOCAD_VERSION=$cmakeVer" >> $env:GITHUB_ENV

      - name: windows (dynamic) - configure, build, ctest
        shell: pwsh
        run: |
          cmake --preset windows -DCMAKE_CXX_CLANG_TIDY=clang-tidy
          cmake --build --preset windows
          ctest --preset windows --output-on-failure

      - name: windows-static (single self-contained exe) - configure, build, ctest
        shell: pwsh
        run: |
          cmake --preset windows-static
          cmake --build --preset windows-static
          ctest --preset windows-static --output-on-failure

      - name: Package release zip
        shell: pwsh
        run: ./scripts/package.ps1 -NoBuild -Preset windows-static

      # Optional code-signing: only runs if a cert secret is configured (no-op otherwise).
      - name: Code-sign (optional)
        if: ${{ env.BIOCAD_SIGN_SHA1 != '' || env.BIOCAD_SIGN_PFX != '' }}
        shell: pwsh
        env:
          BIOCAD_SIGN_PFX: ${{ secrets.BIOCAD_SIGN_PFX }}
          BIOCAD_SIGN_PFX_PASSWORD: ${{ secrets.BIOCAD_SIGN_PFX_PASSWORD }}
          BIOCAD_SIGN_SHA1: ${{ secrets.BIOCAD_SIGN_SHA1 }}
        run: ./scripts/sign.ps1 -Exe "dist/BioCAD-$env:BIOCAD_VERSION-win-x64/BioCAD.exe"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: BioCAD-win-x64
          path: dist/BioCAD-*-win-x64.zip
          if-no-files-found: error

      # The dynamic build is what docs-media captures from, and rebuilding it in a
      # separate job would double the vcpkg cost, so hand it over as an artifact.
      - name: Upload dynamic build for the capture job
        uses: actions/upload-artifact@v4
        with:
          name: biocad-windows-build
          path: build/windows/bin/**
          if-no-files-found: error

  docs-media:
    name: capture panel screenshots
    needs: build-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the dynamic build
        uses: actions/download-artifact@v4
        with:
          name: biocad-windows-build
          path: build/windows/bin

      # In-app back-buffer readback, so this works with no interactive desktop
      # session. A black or truncated PNG makes the script throw.
      - name: Capture every panel
        shell: pwsh
        run: ./scripts/capture-docs.ps1 -Preset windows

      - name: Upload media
        uses: actions/upload-artifact@v4
        with:
          name: biocad-docs-media
          path: docs/media/**
          if-no-files-found: error

  docs-gif:
    name: encode GIFs
    needs: docs-media
    # ffmpeg ships on the Ubuntu image, so the Windows runner never needs it.
    runs-on: ubuntu-latest
    steps:
      - name: Download captured media
        uses: actions/download-artifact@v4
        with:
          name: biocad-docs-media
          path: media

      - name: Encode frame sequences with a two-pass palette
        run: |
          set -euo pipefail
          shopt -s nullglob
          made=0
          for first in media/*-0000.png; do
            stem="${first%-0000.png}"
            name="$(basename "$stem")"
            echo "encoding $name"
            filters="fps=15,scale=900:-1:flags=lanczos"
            ffmpeg -y -framerate 30 -i "${stem}-%04d.png" \
                   -vf "${filters},palettegen=stats_mode=diff" "/tmp/${name}-palette.png"
            ffmpeg -y -framerate 30 -i "${stem}-%04d.png" -i "/tmp/${name}-palette.png" \
                   -lavfi "${filters}[x];[x][1:v]paletteuse=dither=bayer:bayer_scale=3" \
                   "media/${name}.gif"
            made=$((made + 1))
          done
          if [ "$made" -eq 0 ]; then
            echo "no frame sequences found - docs-media produced no <name>-0000.png" >&2
            exit 1
          fi

      - name: Upload GIFs
        uses: actions/upload-artifact@v4
        with:
          name: biocad-docs-gifs
          path: media/*.gif
          if-no-files-found: error
